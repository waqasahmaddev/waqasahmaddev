name: Update latest posts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch posts from my own API
        run: curl -fsSL -A "Mozilla/5.0 (profile-readme-updater)" https://waqasahmaddev.com/api/posts.json -o posts.json

      - name: Update README
        run: python3 scripts/update_posts.py posts.json README.md 3

      - name: Commit if something changed
        run: |
          if git diff --quiet README.md; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update latest posts"
          git push
